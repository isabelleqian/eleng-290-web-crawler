<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Policy Measure Review · ELENG 290</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="measure_review.js" defer></script>
  <link rel="stylesheet" href="editorial.css?v=20261118-4">
</head>
<body class="min-h-screen bg-[#141816] px-4 py-6 text-slate-100 md:px-8">
  <header class="mx-auto mb-6 flex max-w-7xl flex-wrap items-end justify-between gap-4 border-b border-slate-800 pb-5">
    <div>
      <p class="text-xs uppercase tracking-wide text-slate-400">ELENG 290 · Policy Commons</p>
      <h1 class="mt-1 font-serif text-3xl font-semibold text-white">Policy Measure Review</h1>
      <p id="review-summary" class="mt-2 max-w-2xl text-sm text-slate-300"></p>
      <a href="policy_database.html" class="mt-3 inline-block rounded-lg border border-blue-700 px-3 py-1.5 text-sm text-blue-200 hover:bg-blue-950">← Policy Database</a>
    </div>
    <div>
      <nav aria-label="Site navigation" class="flex flex-wrap items-center gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs">
        <a href="index.html" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition">Overview Map</a>
        <a href="news_database.html" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition">News Database</a>
        <a href="policy_database.html" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition">Policy Database</a>
        <a href="law_database.html" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition">U.S. Law Database</a>
        <a href="crosswalk.html" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition">News ↔ Law Crosswalk</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto grid max-w-7xl gap-4 lg:grid-cols-[minmax(16rem,1fr)_minmax(0,3fr)]">
    <aside class="space-y-4">
      <form id="review-filters" aria-label="Filter measure instances" class="space-y-3 rounded-xl border border-slate-800 bg-slate-900 p-4">
        <label class="flex flex-col gap-1 text-sm">Search instances
          <input name="q" type="search" placeholder="Instance ID, title or evidence" class="rounded-md border border-slate-700 bg-slate-950 px-2 py-2">
        </label>
        <div id="review-options" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-1"></div>
        <button type="reset" class="rounded-md border border-slate-700 px-3 py-1.5 text-sm hover:bg-slate-800">Reset filters</button>
      </form>
      <section id="code-definition" hidden aria-label="Selected code definition" class="rounded-xl border border-slate-800 bg-slate-900 p-4"></section>
    </aside>
    <section aria-label="Measure instances">
      <p id="review-count" role="status" class="mb-3 text-sm text-slate-300">Loading measures…</p>
      <div id="review-results" class="space-y-3"></div>
    </section>
  </main>
</body>
</html>
