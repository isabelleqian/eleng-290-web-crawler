<script type="application/json" id="policy-measure-data">{"categories":[{"code":"A","name":"Access and circulation regulation"},{"code":"B","name":"Physical and spatial traffic interventions"},{"code":"C","name":"Traffic operations and network management"},{"code":"D","name":"Pricing and economic measures"},{"code":"E","name":"Routing-platform and information interventions"},{"code":"F","name":"Data, coordination, and supportive measures"}],"codes":[{"code":"E3","name":"Route guidance and routing criteria","category":"E","definition":"Measures that modify how routing services select, prioritize, or recommend routes, including changes to routing algorithms, optimization objectives, road hierarchy preferences, and the consideration of safety, neighborhood impacts, congestion, or environmental outcomes."},{"code":"F2","name":"Government-platform coordination and pilot programs","category":"F","definition":"Partnerships, pilots, working groups, memoranda, or other cooperative arrangements through which public agencies and routing providers develop or test responses to routing-related problems."},{"code":"F1","name":"Government-platform data exchange and official data feeds","category":"F","definition":"Arrangements through which public agencies and routing providers exchange traffic, incident, closure, restriction, routing, or other mobility information, including official data feeds supplied for use by navigation services."},{"code":"B1","name":"Traffic filters, diverters, and closures","category":"B","definition":"Physical interventions that block or redirect one or more motor-vehicle movements while potentially retaining access for selected users or modes. Examples include full or partial closures, diagonal diverters, median barriers, bollards, modal filters, and forced-turn channelization."},{"code":"B2","name":"Vertical traffic calming","category":"B","definition":"Raised roadway treatments that reduce vehicle speeds and route attractiveness. Examples include speed humps, speed tables, raised crosswalks, and raised intersections."},{"code":"C4","name":"Speed management and harmonization","category":"C","definition":"Static or dynamic regulation or management of vehicle speeds to improve safety or traffic performance and alter route attractiveness. Examples include reduced speed limits, variable speed limits, advisory speeds, and speed harmonization."},{"code":"A2","name":"Through-traffic restrictions","category":"A","definition":"Measures prohibiting vehicles from passing through a designated street, neighborhood, or area when they do not have a local origin, destination, or other qualifying purpose. Examples include “local traffic only” and “no through traffic” rules."},{"code":"A5","name":"Vehicle- or trip-purpose-based access restrictions","category":"A","definition":"Restrictions that apply according to vehicle type, user type, trip purpose, occupancy, emissions class, commercial function, or similar characteristics. Examples include truck restrictions, delivery restrictions, resident-only access, and restrictions on non-local trips."},{"code":"A1","name":"Turn restrictions","category":"A","definition":"Prohibitions or limitations on specified turning movements intended to prevent or discourage particular traffic routes. Restrictions may be permanent, time-specific, or dynamically activated. Examples include no-left-turn, no-right-turn, and peak-hour turn restrictions."},{"code":"C1","name":"Traffic signal control and timing","category":"C","definition":"Fixed, coordinated, responsive, or adaptive modification of signal timing, phasing, priority, or operation to influence traffic flow, delay, route attractiveness, or network performance. Examples include signal coordination, deliberate added delay, adaptive control, and transit or emergency priority."},{"code":"A3","name":"One-way and circulation restrictions","category":"A","definition":"Changes to permitted directions of travel or circulation patterns that remove, redirect, or lengthen potential shortcut routes. Examples include one-way conversions, forced circulation patterns, and directional access restrictions."},{"code":"F3","name":"Routing-impact monitoring and traffic analysis","category":"F","definition":"Collection or analysis of data specifically intended to identify, quantify, monitor, or evaluate routing-induced traffic or cut-through impacts. Examples include traffic counts, origin-destination analysis, detectors, cameras, probes, Bluetooth data, commercial mobility data, and before–after studies."},{"code":"B5","name":"Road-space reallocation","category":"B","definition":"Reassignment or removal of space previously available to general motor traffic or parking in favor of walking, cycling, transit, public space, loading, or other uses where the intervention changes vehicle capacity or routing. Examples include road diets, pedestrianization, bicycle lanes, and removal of general-purpose travel lanes."},{"code":"D6","name":"Parking pricing","category":"D","definition":"Parking charges designed to influence vehicle access, circulation, parking demand, or travel demand. This includes fixed, location-based, time-based, and dynamic parking prices."},{"code":"F6","name":"Traveler information and behavioral interventions","category":"F","definition":"Informational, educational, social, or behavioral interventions that influence travelers' route, mode, departure-time, or driving choices. Examples include public campaigns, community-led initiatives, targeted travel information, behavioral nudges, and coordinated efforts to discourage cut-through traffic."},{"code":"B4","name":"Intersection geometry and traffic circles","category":"B","definition":"Physical redesign of intersections to reduce speeds, alter vehicle movements, or make shortcut routes less attractive. Examples include neighborhood traffic circles, mini-roundabouts, realigned intersections, raised medians, and curb-radius reductions."},{"code":"A4","name":"Permit-based access and exemptions","category":"A","definition":"Access rules under which specified users or vehicles are authorized to enter, travel through, or make movements otherwise restricted to general traffic. Examples include resident permits, local-access permits, and exemptions for deliveries or emergency vehicles."},{"code":"B3","name":"Street narrowing and horizontal deflection","category":"B","definition":"Geometric treatments that narrow or laterally alter the vehicle path to reduce speed or discourage through movement. Examples include chicanes, chokers, neckdowns, curb extensions, lateral shifts, center-island narrowings, and lane narrowing."},{"code":"B6","name":"Surface and perceptual traffic calming","category":"B","definition":"Surface, marking, visual, or gateway treatments intended to influence driver perception or reduce speeds without substantially changing network connectivity. Examples include textured pavement, rumble strips, contrasting surfaces, transverse markings, and gateway treatments."},{"code":"C2","name":"Stop and priority control","category":"C","definition":"Installation or modification of stop, yield, or other priority-control rules that change intersection operations and the travel-time attractiveness of a route. Examples include new stop signs and all-way stop control."},{"code":"C3","name":"Roadway and ramp metering","category":"C","definition":"Measures controlling the rate at which vehicles enter a roadway, freeway, corridor, or downstream traffic system to manage demand or traffic distribution. Examples include freeway ramp metering, mainline metering, arterial gating, and peak-period ramp closures."},{"code":"C5","name":"Dynamic lane and roadway allocation","category":"C","definition":"Dynamic or time-dependent changes to lane assignment, lane direction, roadway capacity, or permitted lane use in response to traffic demand or conditions. Examples include dynamic lane grouping, reversible lanes, temporary shoulder use, and dynami
